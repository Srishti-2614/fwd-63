<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaints Board | SAU Mess Portal</title>
  <script>try{var t=localStorage.getItem("messTheme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="../images/logo.png">
  <link rel="stylesheet" href="../css/style.css?v=6">
</head>
<body>
  <header>
    <a class="brand" href="../index.html"><img class="logo" src="../images/logo.png" alt="South Asian University logo" onerror="this.hidden=true;this.parentNode.classList.add('nologo')">SAU Mess Portal</a>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../pages/feedback.html">Quick Feedback</a>
      <a href="../pages/submit.html">Submit Complaint</a>
      <a class="active" href="../pages/board.html">Complaints Board</a>
      <a href="../pages/dashboard.html">Dashboard</a>
      <a href="../pages/about.html">About</a>
      <a href="../pages/contact.html">Contact</a>
    </nav>
  </header>
  <main><section>
    <h2>Complaints Board</h2>
    <div class="stats" id="stats"></div>
    <div class="filters">
      <div><label for="q">Search</label><input type="search" id="q" placeholder="Search complaints..."></div>
      <div><label for="fCat">Category</label><select id="fCat"><option value="">All categories</option><option>Food quality</option><option>Hygiene</option><option>Staff</option><option>Queues and timings</option><option>Menu</option><option>Other</option></select></div>
      <div><label for="fStatus">Status</label><select id="fStatus"><option value="">All</option><option>Open</option><option>Resolved</option></select></div>
    </div>
    <div class="cards" id="cards"></div>
  </section></main>
  <footer>SAU Mess Portal | South Asian University, Maidan Garhi, New Delhi | Knowledge without borders<br>Fundamentals of Web Design project by Srishti Dahiya, Section D</footer>
  <script src="../js/script.js"></script>
